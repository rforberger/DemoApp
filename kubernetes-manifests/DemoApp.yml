apiVersion: apps.example.com/v1alpha1
kind: DemoApp
metadata:
  name: my-demoapp
  namespace: default
spec:
  foo: "Testvalue"
  servicePort: 8080
  targetPort: 8080 # frontend
  servicePortBackend: 5001
  targetPortBackend: 5001 # backend
  deployments:
    - name: frontend
      imagePullSecrets:
        - name: docker-io-regcred
      replicas: 2
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
      containers:
        - name: frontend-container
          image: caddy:alpine
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
          args: ["caddy", "reverse-proxy", "--from", "http://ai-jobrecommender.srv.ronnyforberger.de:8080", "--to", "backend:5001"]
    - name: backend
      imagePullSecrets:
        - name: docker-io-regcred
      replicas: 1
      strategy:
        type: Recreate
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          cpu: "500m"
          memory: "1024Mi"
      containers:
        - name: backend-container
          image: docker.io/rforberger/ai_job_recommendations:2026-11
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 15
  gateway:
    name: public-gateway
    namespace: default
    port: 8080
    http:
      hostnames:
        - ai-jobrecommender.srv.ronnyforberger.de
      path: /
      port: 5001


