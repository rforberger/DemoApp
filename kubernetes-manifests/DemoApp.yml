apiVersion: apps.example.com/v1alpha1
kind: DemoApp
metadata:
  name: my-demoapp
  namespace: default
spec:
  foo: "Testvalue"
  deployments:
    - name: frontend
      replicas: 2
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
      containers:
        - name: frontend-container
          targetPort: 8080
          image: jxlwqq/http-echo:latest
          readinessProbe:
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
          args: ["--text","Hello Frontend!"]
    - name: backend
      replicas: 1
      strategy:
        type: Recreate
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"
      containers:
        - name: backend-container
          targetPort: 8080
          image: jxlwqq/http-echo:latest
          readinessProbe:
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 15
          args: ["--text","Hello Kubernetes!"]
  gateway:
    name: public-gateway
    namespace: default
    port: 8080
    http:
      hostnames:
        - 152.53.208.33
      path: /
      port: 8080


